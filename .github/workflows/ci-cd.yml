name: 2D Sprite Renderer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  auto-tag:
    name: Auto Tag
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag
        id: version
        env:
          VERSION_MAJOR: ${{ vars.VERSION_MAJOR }}
          VERSION_MINOR: ${{ vars.VERSION_MINOR }}
        run: |
          if [ -z "$VERSION_MAJOR" ] || [ -z "$VERSION_MINOR" ]; then
            echo "ERROR: VERSION_MAJOR and VERSION_MINOR must be set in GitHub repository variables"
            exit 1
          fi

          git fetch --tags

          PREFIX="v${VERSION_MAJOR}.${VERSION_MINOR}."

          LATEST=$(git tag --sort=-v:refname | grep -E "^${PREFIX}[0-9]+$" | head -1 || true)

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "Version: $NEW_VERSION"
          echo "Tag: $NEW_TAG"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - auto-tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.auto-tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes